appId: com.renato.reroll
productName: Reroll
directories:
  output: release
  buildResources: build
# ---------------------------------------------------------------------------------------------
# TRÊS PASTAS NOMEADAS, e não `out/**/*`.
#
# `out/` é onde o electron-vite escreve os três bundles, mas é TAMBÉM onde qualquer coisa que rode
# durante o desenvolvimento acaba escrevendo: as renderizações de conferência, os scripts de
# medição, os arquivos de rascunho. Com o curinga, tudo isso entrava no instalador — aconteceu no
# 0.1.8 e ia acontecer de novo aqui, com 2,3 MB de bancada e capturas de tela do app inacabado
# dentro do pacote que vai pros amigos.
#
# Listar as três pastas de verdade é o que impede a próxima vez: o que não é bundle não tem como
# entrar por descuido, porque não tem nome nesta lista.
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - build/icons/**/*
asar: true
# ---------------------------------------------------------------------------------------------
# FUSES: o que o BINÁRIO do Electron aceita fazer, decidido no empacotamento e gravado dentro do
# executável — não dá pra ligar de volta por variável de ambiente, argumento ou arquivo.
#
# Achado da revisão de segurança do 1.0.12, MEDIDO no instalado:
#
#     ELECTRON_RUN_AS_NODE=1 Reroll.exe -e "console.log(process.versions.node)"   → 24.18.1
#
# Ou seja, o executável que vai pros amigos era um Node.js completo a uma variável de ambiente de
# distância: qualquer script que rodasse na máquina podia usar o `Reroll.exe` como intérprete pra
# executar o que quisesse com a cara de um app conhecido (é o truque clássico pra passar por lista
# branca de antivírus — e este app já foi confundido com malware uma vez, ver `index.ts`).
#
# - `runAsNode`: fecha exatamente isso.
# - `enableNodeOptionsEnvironmentVariable`: `NODE_OPTIONS=--require=x.js` injetaria código no
#   processo principal antes do app.
# - `enableNodeCliInspectArguments`: `--inspect` abriria o depurador do processo principal, com o
#   disco e o sistema inteiro ao alcance de quem se conectasse.
# - `onlyLoadAppFromAsar`: sem isto, uma pasta `app/` deixada ao lado do `app.asar` tem precedência
#   sobre ele — trocar o app inteiro sem tocar no arquivo empacotado.
# - `enableCookieEncryption`: o app não usa cookie; ligado por ser o padrão recomendado.
#
# O que NÃO está ligado, de propósito: `enableEmbeddedAsarIntegrityValidation`. Ele faria o
# executável recusar um `app.asar` cujo hash não bata com o gravado no `.exe` — e o ciclo de
# entrega deste projeto copia SÓ o `app.asar` por cima da instalação (ver a memória do projeto).
# Ligar quebraria essa entrega em silêncio: o app simplesmente não abriria. Fica como recomendação
# pro dia em que o executável for assinado e a entrega passar a ser sempre pelo instalador.
#
# Só vale no EMPACOTADO: `npm run dev` roda o Electron de `node_modules`, sem fuse nenhum.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
# Os ícones da janela ficam FORA do asar. `BrowserWindow({ icon })` e `nativeImage.createFromPath`
# leem o arquivo pelo lado nativo, que não enxerga o conteúdo empacotado do asar — dentro dele o
# caminho existe pro Node e não existe pro Windows, e o resultado é a janela instalada aparecendo
# com o ícone genérico do Electron na barra de tarefas mesmo com tudo configurado. Ver
# `resolveAppIconPath`, que aponta pra cá.
asarUnpack:
  - build/icons/**/*
compression: maximum
electronLanguages:
  - en-US
  - pt-BR
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # ---------------------------------------------------------------------------------------------
  # SEM ELEVAÇÃO, NUNCA. Instalação por USUÁRIO, e ponto.
  #
  # Isto é a correção do "a tela trava quando atualiza" que o usuário relatou. O que trava não é o
  # app: é o UAC. Quando o instalador pede administrador, o Windows acende a ÁREA DE TRABALHO
  # SEGURA — escurece a tela inteira, ignora teclado e mouse de tudo o mais e espera a resposta. Pra
  # quem não é de computador, isso é indistinguível de um travamento, ainda mais numa atualização
  # que roda em silêncio e sem janela nenhuma explicando.
  #
  # Com `allowElevation: false` o instalador não tem como pedir: ele instala na pasta do usuário,
  # onde já tem permissão. O preço é não poder instalar em pasta protegida (`Program Files`) — que
  # é justamente onde este app não precisa estar.
  #
  # `perMachine: false` é o padrão, e está escrito porque é a metade que garante a outra: instalar
  # "pra todos os usuários" exige administrador por definição.
  allowElevation: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # O instalador atualiza POR CIMA de uma instalação existente — ninguém desinstala nada, e os dados
  # (presets, anotações, preferências) ficam em %APPDATA%\Reroll, que ele não toca. É isso que faz o
  # update automático funcionar: o `electron-updater` baixa este mesmo .exe e roda em silêncio.
  #
  # NOME SEM ESPAÇOS, e isso não é gosto: o `latest.yml` que o próprio electron-builder gera aponta
  # pra `Reroll-Setup-<versão>.exe` com hífens, enquanto o padrão do arquivo é "Reroll Setup
  # <versão>.exe" com espaços. Some-se a isso que o GitHub troca espaço por ponto no nome do anexo ao
  # subir, e o resultado é o app instalado procurando um arquivo que não existe na release — update
  # quebrado com 404 e nenhuma pista do motivo. Com os dois nomes iguais, o caminho fecha.
  artifactName: ${productName}-Setup-${version}.${ext}

# De onde o app instalado pergunta se existe versão nova. O `electron-builder` grava este bloco num
# `app-update.yml` dentro do pacote, e é dele que o `electron-updater` lê em tempo de execução —
# trocar de hospedagem depois é mexer aqui e gerar de novo.
#
# O repositório precisa ser PÚBLICO: em repositório privado o download do anexo exige token, e o app
# de quem instalou não tem nenhum.
publish:
  provider: github
  owner: renatomsantana
  repo: reroll
  # A release publicada não é rascunho nem pré-lançamento. Pré-lançamento o app aceita porque
  # `updater.ts` liga `allowPrerelease` À MÃO — este comentário dizia que o `electron-updater` ligava
  # sozinho pelo sufixo `-alpha`, e foi medido que não liga (ver o comentário de lá). Rascunho ele
  # não enxerga de jeito nenhum.
  releaseType: release
