<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- A mesma CSP do renderer do Electron (ver o comentário em `src/renderer/index.html`). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <!-- `viewport-fit=cover` por causa do recorte de tela dos celulares; `user-scalable` fica
         ligado de propósito (acessibilidade), o `touch-action` do web.css já segura o zoom por
         toque duplo nos botões. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c0c0c0" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icone.png" />
    <title>Reroll</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bootstrap.ts"></script>
  </body>
</html>
